<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 200" aria-hidden="true">
  <defs>
    <radialGradient id="or-bauble" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="currentColor" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="or-cap" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5c4422"/>
      <stop offset="50%" stop-color="#d4a857"/>
      <stop offset="100%" stop-color="#2b1d09"/>
    </linearGradient>
  </defs>
  <!-- hanging string -->
  <line x1="70" y1="0" x2="70" y2="32" stroke="#3d2c14" stroke-width="1.2"/>
  <!-- top loop / hook -->
  <path d="M62 30 Q70 22 78 30" fill="none" stroke="url(#or-cap)" stroke-width="2"/>
  <!-- cap -->
  <rect x="60" y="32" width="20" height="14" rx="2" fill="url(#or-cap)" stroke="#2b1d09" stroke-width="0.8"/>
  <rect x="60" y="44" width="20" height="3" fill="#2b1d09"/>
  <!-- bauble sphere -->
  <circle cx="70" cy="106" r="58" fill="url(#or-bauble)" stroke="currentColor" stroke-width="1.4" opacity="0.95"/>
  <!-- decorative band -->
  <ellipse cx="70" cy="98" rx="58" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="70" cy="116" rx="58" ry="6" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
  <!-- snowflake-shape painted on bauble -->
  <g stroke="#f4ede0" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
    <line x1="70" y1="86" x2="70" y2="126"/>
    <line x1="52" y1="106" x2="88" y2="106"/>
    <line x1="58" y1="92" x2="82" y2="120"/>
    <line x1="82" y1="92" x2="58" y2="120"/>
    <!-- branches -->
    <path d="M70 92 L66 88 M70 92 L74 88"/>
    <path d="M70 120 L66 124 M70 120 L74 124"/>
    <path d="M56 102 L52 100 M56 102 L52 106 M84 102 L88 100 M84 102 L88 106"/>
  </g>
  <!-- specular highlight -->
  <ellipse cx="54" cy="84" rx="14" ry="8" fill="#f4ede0" opacity="0.55"/>
  <ellipse cx="50" cy="80" rx="5" ry="3" fill="#fff" opacity="0.85"/>
  <!-- shadow under -->
  <ellipse cx="70" cy="180" rx="22" ry="4" fill="#000" opacity="0.25"/>
</svg>
