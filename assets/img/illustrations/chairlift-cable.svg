<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true">
  <!-- main cable -->
  <line x1="0" y1="30" x2="1200" y2="30" stroke="currentColor" stroke-width="1.2" opacity="0.55"/>
  <!-- small chairs hanging -->
  <g stroke="currentColor" stroke-width="1" fill="none" opacity="0.7">
    <!-- chair 1 -->
    <g transform="translate(120 30)">
      <line x1="0" y1="0" x2="0" y2="14"/>
      <rect x="-9" y="14" width="18" height="9" rx="1.5" fill="currentColor" opacity="0.85"/>
      <line x1="-7" y1="23" x2="-7" y2="30"/>
      <line x1="7" y1="23" x2="7" y2="30"/>
    </g>
    <!-- chair 2 -->
    <g transform="translate(360 30)">
      <line x1="0" y1="0" x2="0" y2="14"/>
      <rect x="-9" y="14" width="18" height="9" rx="1.5" fill="currentColor" opacity="0.85"/>
      <line x1="-7" y1="23" x2="-7" y2="30"/>
      <line x1="7" y1="23" x2="7" y2="30"/>
    </g>
    <!-- chair 3 -->
    <g transform="translate(620 30)">
      <line x1="0" y1="0" x2="0" y2="14"/>
      <rect x="-9" y="14" width="18" height="9" rx="1.5" fill="currentColor" opacity="0.85"/>
      <line x1="-7" y1="23" x2="-7" y2="30"/>
      <line x1="7" y1="23" x2="7" y2="30"/>
    </g>
    <!-- chair 4 -->
    <g transform="translate(880 30)">
      <line x1="0" y1="0" x2="0" y2="14"/>
      <rect x="-9" y="14" width="18" height="9" rx="1.5" fill="currentColor" opacity="0.85"/>
      <line x1="-7" y1="23" x2="-7" y2="30"/>
      <line x1="7" y1="23" x2="7" y2="30"/>
    </g>
    <!-- chair 5 -->
    <g transform="translate(1080 30)">
      <line x1="0" y1="0" x2="0" y2="14"/>
      <rect x="-9" y="14" width="18" height="9" rx="1.5" fill="currentColor" opacity="0.85"/>
      <line x1="-7" y1="23" x2="-7" y2="30"/>
      <line x1="7" y1="23" x2="7" y2="30"/>
    </g>
  </g>
  <!-- cable clamps where chair meets cable -->
  <g fill="currentColor" opacity="0.7">
    <circle cx="120" cy="30" r="2"/>
    <circle cx="360" cy="30" r="2"/>
    <circle cx="620" cy="30" r="2"/>
    <circle cx="880" cy="30" r="2"/>
    <circle cx="1080" cy="30" r="2"/>
  </g>
</svg>
