<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" aria-hidden="true">
  <defs>
    <radialGradient id="wr-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a857" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#d4a857" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#d4a857" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wr-needle" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3d6650"/>
      <stop offset="100%" stop-color="#0e2218"/>
    </radialGradient>
    <radialGradient id="wr-berry" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e57975"/>
      <stop offset="55%" stop-color="#c75450"/>
      <stop offset="100%" stop-color="#6e2421"/>
    </radialGradient>
    <linearGradient id="wr-ribbon" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8a2e2a"/>
      <stop offset="50%" stop-color="#c75450"/>
      <stop offset="100%" stop-color="#5a1816"/>
    </linearGradient>
  </defs>
  <!-- soft glow -->
  <circle cx="120" cy="120" r="118" fill="url(#wr-glow)"/>
  <!-- base ring (faint shadow inside ring) -->
  <circle cx="120" cy="120" r="62" fill="none" stroke="#0e2218" stroke-width="2" opacity="0.5"/>
  <!-- needle cluster: 18 radial diamond bundles forming the wreath -->
  <g fill="url(#wr-needle)" stroke="#0e2218" stroke-width="0.6">
    <!-- generate 18 clusters at 20deg increments -->
    <g transform="translate(120 120)">
      <!-- We layer two diamond shapes per spoke for richness -->
      <g transform="rotate(0)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(20)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(40)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(60)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(80)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(100)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(120)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(140)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(160)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(180)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(200)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(220)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(240)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(260)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(280)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(300)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(320)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
      <g transform="rotate(340)">
        <path d="M40 0 L80 -14 L86 0 L80 14 Z"/>
        <path d="M50 -10 L72 -22 L80 -8 L62 0 Z"/>
        <path d="M50 10 L72 22 L80 8 L62 0 Z"/>
      </g>
    </g>
  </g>
  <!-- berries scattered around -->
  <g stroke="#5a1816" stroke-width="0.6">
    <circle cx="180" cy="78" r="5" fill="url(#wr-berry)"/>
    <circle cx="186" cy="84" r="4" fill="url(#wr-berry)"/>
    <circle cx="64" cy="160" r="5" fill="url(#wr-berry)"/>
    <circle cx="70" cy="170" r="4" fill="url(#wr-berry)"/>
    <circle cx="160" cy="190" r="4.5" fill="url(#wr-berry)"/>
    <circle cx="92" cy="60" r="4.5" fill="url(#wr-berry)"/>
    <circle cx="200" cy="138" r="4" fill="url(#wr-berry)"/>
  </g>
  <!-- pinecones -->
  <g>
    <ellipse cx="50" cy="100" rx="6" ry="9" fill="#4a3416" stroke="#2b1d09" stroke-width="0.6"/>
    <path d="M48 96 L52 96 M47 100 L53 100 M48 104 L52 104" stroke="#2b1d09" stroke-width="0.6"/>
    <ellipse cx="160" cy="48" rx="6" ry="9" fill="#4a3416" stroke="#2b1d09" stroke-width="0.6" transform="rotate(20 160 48)"/>
    <path d="M158 44 L162 44 M157 48 L163 48 M158 52 L162 52" stroke="#2b1d09" stroke-width="0.6"/>
  </g>
  <!-- ribbon bow at top -->
  <g>
    <!-- left loop -->
    <path d="M120 36 C 96 24 76 32 78 50 C 80 64 102 60 120 50 Z" fill="url(#wr-ribbon)" stroke="#3a1110" stroke-width="0.8"/>
    <!-- right loop -->
    <path d="M120 36 C 144 24 164 32 162 50 C 160 64 138 60 120 50 Z" fill="url(#wr-ribbon)" stroke="#3a1110" stroke-width="0.8"/>
    <!-- center knot -->
    <rect x="114" y="34" width="12" height="22" rx="2" fill="#8a2e2a" stroke="#3a1110" stroke-width="0.8"/>
    <!-- highlight knot -->
    <rect x="116" y="36" width="3" height="18" rx="1" fill="#e57975" opacity="0.7"/>
    <!-- tails -->
    <path d="M114 56 L96 100 L108 96 L120 58 Z" fill="url(#wr-ribbon)" stroke="#3a1110" stroke-width="0.6"/>
    <path d="M126 56 L144 100 L132 96 L120 58 Z" fill="url(#wr-ribbon)" stroke="#3a1110" stroke-width="0.6"/>
  </g>
  <!-- snow flecks on top of wreath -->
  <g fill="#f4ede0" opacity="0.85">
    <circle cx="80" cy="80" r="2"/>
    <circle cx="160" cy="84" r="2"/>
    <circle cx="124" cy="62" r="1.5"/>
    <circle cx="100" cy="70" r="1"/>
    <circle cx="146" cy="70" r="1"/>
  </g>
</svg>
