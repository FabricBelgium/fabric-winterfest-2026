<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" aria-hidden="true">
  <defs>
    <linearGradient id="map-bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#102943"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="map-pin-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a1f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="220" rx="8" fill="url(#map-bg)"/>
  <!-- grid lines -->
  <g stroke="#163558" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="40" x2="320" y2="40"/>
    <line x1="0" y1="80" x2="320" y2="80"/>
    <line x1="0" y1="120" x2="320" y2="120"/>
    <line x1="0" y1="160" x2="320" y2="160"/>
    <line x1="60" y1="0" x2="60" y2="220"/>
    <line x1="120" y1="0" x2="120" y2="220"/>
    <line x1="180" y1="0" x2="180" y2="220"/>
    <line x1="240" y1="0" x2="240" y2="220"/>
  </g>
  <!-- roads -->
  <g stroke="#d4a857" stroke-width="2" fill="none" opacity="0.45">
    <path d="M0 140 Q80 130 160 132 Q230 134 320 120"/>
    <path d="M30 0 Q60 60 80 130"/>
    <path d="M180 0 Q200 60 260 110"/>
    <path d="M0 80 Q100 70 200 80 Q260 86 320 70"/>
  </g>
  <!-- secondary streets -->
  <g stroke="#3d6650" stroke-width="0.8" fill="none" opacity="0.5">
    <path d="M50 50 L120 100 L180 110"/>
    <path d="M220 30 L240 100 L260 180"/>
    <path d="M70 170 L160 170 L210 200"/>
  </g>
  <!-- water (Schelde-ish suggestion) -->
  <path d="M0 200 Q60 188 120 196 Q180 204 240 192 Q280 184 320 196 L320 220 L0 220 Z" fill="#163558" opacity="0.6"/>
  <!-- snowworld building blob -->
  <g transform="translate(160 110)">
    <rect x="-22" y="-14" width="44" height="28" rx="3" fill="#3d6650" stroke="#d4a857" stroke-width="1.4"/>
    <path d="M-26 -14 L0 -26 L26 -14 Z" fill="#1a3a2e" stroke="#d4a857" stroke-width="1.2"/>
    <!-- snow on roof -->
    <path d="M-26 -14 L0 -26 L26 -14 L20 -12 L0 -22 L-20 -12 Z" fill="#f4ede0" opacity="0.85"/>
  </g>
  <!-- pin glow halo -->
  <circle cx="160" cy="100" r="46" fill="url(#map-pin-glow)"/>
  <!-- pin -->
  <g transform="translate(160 86)">
    <path d="M0 -16 C -10 -16 -16 -8 -16 0 C -16 12 0 28 0 28 C 0 28 16 12 16 0 C 16 -8 10 -16 0 -16 Z" fill="#ff9a1f" stroke="#5c4422" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="6" fill="#0a1628"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffb84d"/>
  </g>
  <!-- label -->
  <g font-family="JetBrains Mono, monospace" fill="#f4ede0">
    <text x="160" y="160" font-size="9" text-anchor="middle" letter-spacing="2">SNOWWORLD ANTWERPEN</text>
    <text x="160" y="174" font-size="7" text-anchor="middle" letter-spacing="1.5" opacity="0.65">Moerelei 123, 2610</text>
  </g>
  <!-- compass -->
  <g transform="translate(286 32)" fill="#d4a857" stroke="#d4a857" stroke-width="0.8">
    <circle r="14" fill="none" opacity="0.6"/>
    <path d="M0 -10 L4 0 L0 -3 L-4 0 Z"/>
    <path d="M0 10 L4 0 L0 3 L-4 0 Z" opacity="0.5"/>
    <text x="0" y="-16" font-family="JetBrains Mono, monospace" font-size="6" text-anchor="middle" stroke="none" fill="#d4a857">N</text>
  </g>
</svg>
